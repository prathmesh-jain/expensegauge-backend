services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Dokploy writes the variables from its Environment tab to .env next to this file
    env_file:
      - .env
    environment:
      # Pin the container port so the Dokploy domain can always point at 3000
      PORT: 3000
    expose:
      - "3000"
